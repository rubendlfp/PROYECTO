services:
  - type: web
    name: proyecto
    runtime: docker
    plan: free
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: proyecto-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: proyecto-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: proyecto-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: proyecto-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: proyecto-db
          property: password

databases:
  - name: proyecto-db
    plan: free
